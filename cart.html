<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>قدّاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- SuperQi web-view JSAPI bridge. Injected only inside the app container, so no 404 in a normal browser. -->
<script>
  (function () {
    var ua = navigator.userAgent || "";
    if (/AlipayClient|mPaaSClient|MiniProgram|SuperQi|QiNEO/i.test(ua)) {
      var s = document.createElement("script");
      s.src = "https://appx/web-view.min.js";
      document.head.appendChild(s);
    }
  })();
</script>
</head>
<body>
<div class="promo">توصيل مجاني للطلبات فوق ١٥٠٬٠٠٠ د.ع · بغداد في نفس اليوم</div>
<header class="app-header">
  <a class="brand-link" href="index.html">
    <div class="brand">
      <img class="brand-icon" src="icon-cream.png" alt="قدّاح QADAH">
      <span class="brand-text"><span class="brand-ar">قدّاح</span><span class="brand-en">QADAH</span></span>
    </div>
  </a>
  <a class="cart-link" href="cart.html" aria-label="السلة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
      <path d="M3 6h18"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <span class="cart-badge" data-cart-count>0</span>
  </a>
</header>

<a class="back-link" href="index.html">متابعة التسوق</a>

<main id="view" aria-live="polite">
  <div class="state">جارٍ التحميل...</div>
</main>

<div class="modal-overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">إتمام الطلب</h2>
    <p class="modal-sub">عبّئ بيانات الطلب. الأسعار تُحسب من الخادم عند التأكيد.</p>

    <div class="form-section">بيانات صاحب الطلب</div>
    <div class="field">
      <label for="cName">الاسم *</label>
      <input id="cName" type="text" autocomplete="name">
    </div>
    <div class="two">
      <div class="field">
        <label for="cPhone">رقم الهاتف *</label>
        <input id="cPhone" type="tel" inputmode="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="cEmail">البريد (اختياري)</label>
        <input id="cEmail" type="email" autocomplete="email">
      </div>
    </div>

    <div class="form-section">بيانات المستلم</div>
    <div class="two">
      <div class="field">
        <label for="rName">اسم المستلم *</label>
        <input id="rName" type="text">
      </div>
      <div class="field">
        <label for="rPhone">هاتف المستلم *</label>
        <input id="rPhone" type="tel" inputmode="tel">
      </div>
    </div>

    <div class="form-section">التوصيل</div>
    <div class="field">
      <label for="dAddress">العنوان *</label>
      <textarea id="dAddress"></textarea>
    </div>
    <div class="two">
      <div class="field">
        <label for="dDate">يوم التوصيل (اختياري)</label>
        <input id="dDate" type="date">
      </div>
      <div class="field">
        <label for="dSlot">الفترة (اختياري)</label>
        <select id="dSlot">
          <option value="">اختر</option>
          <option value="صباحاً">صباحاً</option>
          <option value="ظهراً">ظهراً</option>
          <option value="مساءً">مساءً</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="dNotes">ملاحظات التوصيل (اختياري)</label>
      <textarea id="dNotes"></textarea>
    </div>

    <div class="field">
      <label for="gift">رسالة الهدية (اختياري)</label>
      <textarea id="gift"></textarea>
    </div>

    <p class="modal-error" id="modalError"></p>

    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cancelBtn">رجوع</button>
      <button type="button" class="btn-primary" id="confirmBtn">تأكيد الطلب</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="cart.js"></script>
<script src="superqi.js"></script>
<script>
  var CREATE_ORDER_URL = SUPABASE_URL + "/functions/v1/create_order";

  // Local (not UTC) today as YYYY-MM-DD, so the date picker cannot go before today.
  function todayStr() {
    var t = new Date();
    var m = String(t.getMonth() + 1).padStart(2, "0");
    var day = String(t.getDate()).padStart(2, "0");
    return t.getFullYear() + "-" + m + "-" + day;
  }
  (function () {
    var dateEl = document.getElementById("dDate");
    if (dateEl) dateEl.min = todayStr();
  })();

  var view = document.getElementById("view");
  var overlay = document.getElementById("overlay");
  var modalError = document.getElementById("modalError");
  var confirmBtn = document.getElementById("confirmBtn");
  var PRODUCTS = {};

  function setState(html, isError) {
    view.innerHTML =
      '<div class="state' + (isError ? " error" : "") + '">' + html + "</div>";
  }

  function showEmpty() {
    view.innerHTML =
      '<div class="empty">سلتك فارغة.<br><a href="index.html">تصفّح الكتالوج</a></div>';
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function qtyOf(id) {
    var line = Cart.items().find(function (l) { return l.id === id; });
    return line ? line.qty : 0;
  }

  function lineHtml(p, qty) {
    var name = escapeHtml(p.name_ar || p.name_en || "");
    var unit = Number(p.price) || 0;
    var total = unit * qty;
    return (
      '<div class="cart-line">' +
        '<img class="line-img" src="' + imageUrl(p.image_url) + '" alt="' + name + '" ' +
        "onerror=\"this.onerror=null;this.src=PLACEHOLDER_IMG;\">" +
        '<div class="line-body">' +
          '<div class="line-name">' + name + "</div>" +
          '<div class="line-unit">' + formatPrice(unit) + ' د.ع للحبة</div>' +
          '<div class="line-controls">' +
            '<div class="mini-stepper">' +
              '<button type="button" data-action="dec" data-id="' + p.id + '" aria-label="إنقاص">‪−‬</button>' +
              '<span class="mq">' + qty + "</span>" +
              '<button type="button" data-action="inc" data-id="' + p.id + '" aria-label="زيادة">+</button>' +
            "</div>" +
            '<button type="button" class="remove-btn" data-action="remove" data-id="' + p.id + '">حذف</button>' +
          "</div>" +
        "</div>" +
        '<div class="line-total">' + formatPrice(total) + ' <span class="cur">د.ع</span></div>' +
      "</div>"
    );
  }

  function renderCart() {
    var lines = Cart.items().filter(function (l) { return PRODUCTS[l.id]; });
    if (!lines.length) { showEmpty(); return; }

    var pieces = 0;
    var subtotal = 0;
    var rows = lines.map(function (l) {
      var p = PRODUCTS[l.id];
      pieces += l.qty;
      subtotal += (Number(p.price) || 0) * l.qty;
      return lineHtml(p, l.qty);
    }).join("");

    view.innerHTML =
      '<div class="cart-list">' + rows + "</div>" +
      '<div class="summary">' +
        '<div class="summary-row"><span>عدد القطع</span><span>' + pieces + "</span></div>" +
        '<div class="summary-row"><span>المجموع الفرعي</span><span>' + formatPrice(subtotal) + " د.ع</span></div>" +
        '<div class="summary-row"><span>التوصيل</span><span class="muted">يُحسب لاحقاً</span></div>' +
        '<div class="summary-row summary-total"><span>الإجمالي</span><span>' + formatPrice(subtotal) + " د.ع</span></div>" +
      "</div>" +
      '<button type="button" class="checkout-btn" data-action="checkout">إتمام الطلب</button>';
  }

  function showSuccess(order) {
    overlay.classList.remove("open");
    Cart.clear();
    var total = formatPrice(order.total) + " د.ع";
    var code = escapeHtml(order.order_code || "");
    view.innerHTML =
      '<div class="success">' +
        '<div class="tick">✓</div>' +
        "<h2>تم استلام طلبك</h2>" +
        '<div class="code">رقم الطلب: ' + code + "</div>" +
        '<div class="total">الإجمالي: ' + total + "</div>" +
        '<a href="index.html">العودة إلى الكتالوج</a>' +
      "</div>";
  }

  function openModal() {
    modalError.classList.remove("show");
    overlay.classList.add("open");
  }
  function closeModal() {
    overlay.classList.remove("open");
  }
  function showError(msg) {
    modalError.textContent = msg;
    modalError.classList.add("show");
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }

  async function submitOrder() {
    var customerName = val("cName");
    var customerPhone = val("cPhone");
    var recipientName = val("rName");
    var recipientPhone = val("rPhone");
    var address = val("dAddress");

    if (!customerName || !customerPhone) { showError("الرجاء إدخال اسم صاحب الطلب ورقم هاتفه."); return; }
    if (!recipientName || !recipientPhone) { showError("الرجاء إدخال اسم المستلم ورقم هاتفه."); return; }
    if (!address) { showError("الرجاء إدخال عنوان التوصيل."); return; }

    var dDate = val("dDate");
    if (dDate && dDate < todayStr()) {
      showError("لا يمكن اختيار تاريخ توصيل في الماضي.");
      return;
    }

    var payload = {
      channel: "superqi",
      items: Cart.items(),
      customer: { name: customerName, phone: customerPhone, email: val("cEmail") || null },
      recipient: { name: recipientName, phone: recipientPhone },
      delivery: {
        address: address,
        date: dDate || null,
        slot: val("dSlot") || null,
        notes: val("dNotes") || null
      },
      gift_message: val("gift") || null,
      addons: []
    };

    modalError.classList.remove("show");
    confirmBtn.disabled = true;
    confirmBtn.textContent = "جارٍ الإرسال...";

    try {
      var res = await fetch(CREATE_ORDER_URL, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "content-type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      var data = await res.json();

      if (data && data.ok) {
        showSuccess(data.order);
      } else {
        var code = data && data.error;
        var msg =
          code === "product_unavailable" ? "أحد المنتجات لم يعد متاحاً. حدّث سلتك." :
          (data && data.message) ? data.message :
          "تعذّر إنشاء الطلب. حاول مرة أخرى.";
        showError(msg);
      }
    } catch (err) {
      console.error(err);
      showError("تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.");
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "تأكيد الطلب";
    }
  }

  view.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");

    if (action === "inc") {
      Cart.setQty(id, qtyOf(id) + 1);
      renderCart();
    } else if (action === "dec") {
      var q = qtyOf(id);
      if (q > 1) { Cart.setQty(id, q - 1); renderCart(); }
    } else if (action === "remove") {
      Cart.remove(id);
      renderCart();
    } else if (action === "checkout") {
      openModal();
    }
  });

  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  confirmBtn.addEventListener("click", submitOrder);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });

  (async function load() {
    var items = Cart.items();
    if (!items.length) { showEmpty(); return; }
    try {
      var ids = items.map(function (l) { return l.id; });
      var query =
        "select=id,name_ar,name_en,price,image_url&id=in.(" + ids.join(",") + ")";
      var rows = await fetchCatalog(query);
      PRODUCTS = {};
      rows.forEach(function (p) { PRODUCTS[p.id] = p; });
      items.forEach(function (l) {
        if (!PRODUCTS[l.id]) Cart.remove(l.id);
      });
      renderCart();
    } catch (err) {
      console.error(err);
      setState("تعذّر تحميل السلة. تحقق من الاتصال وحاول مرة أخرى.", true);
    }
  })();
</script>
</body>
</html>
